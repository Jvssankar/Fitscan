services:
  - type: web
    name: fitscan-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET
        value: fitscan-refresh-2024
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fitscan-db
          property: connectionString
    healthCheckPath: /health

  - type: cron
    name: fitscan-daily-refresh
    runtime: python
    schedule: "0 6 * * *"
    buildCommand: pip install requests
    startCommand: >
      python -c "
      import os, requests;
      secret=os.environ.get('REFRESH_SECRET','');
      base=os.environ.get('APP_BASE_URL','');
      r=requests.post(base+'/api/refresh',headers={'X-Refresh-Secret':secret},timeout=120);
      print(r.status_code, r.text[:300])
      "
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: REFRESH_SECRET
        value: fitscan-refresh-2024

databases:
  - name: fitscan-db
    databaseName: fitscan
    user: fitscan
    plan: free
